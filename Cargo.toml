[workspace]
members = [
    "jupiter-swap-api-client",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22.1"
reqwest = { version = "0.12", features = ["json"] }
rust_decimal = "1.36.0"
serde = { version = "1.0.159", features = ["derive"] }
serde_json = "1.0.95"
serde_qs = "0.13.0"
solana-account-decoder-client-types = { version = "4", features = ["agave-unstable-api"] }
solana-instruction = "3"
solana-pubkey = "4"
thiserror = "2"
